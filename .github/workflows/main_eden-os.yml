# Legacy Azure deployment path.
#
# EDEN Refinery production is deployed by Vercel from the GitHub `main` branch.
# This workflow is deliberately manual-only so a normal website push cannot
# trigger a second, unrelated production deployment to Azure.

name: Legacy Azure deploy - EDEN-OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A7C7FB08586E4C54A2C171E4D18076F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D576887F60804A7D8CF775D11004A110 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51BD1F48F9284F2DBABDEE891D1F5400 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: EDEN-OS
          slot-name: Production
