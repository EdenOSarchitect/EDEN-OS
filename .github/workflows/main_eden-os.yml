# Azure validation path for EDEN Compute Optimizer v1.
# This trigger exists only on the v1 feature branch so the legacy Azure app can
# be used for a controlled /prove deployment without changing main's deployment policy.

name: Azure deploy - EDEN Compute Optimizer v1

on:
  push:
    branches:
      - eden-compute-optimizer-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s optimizer_v1/tests -v

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A7C7FB08586E4C54A2C171E4D18076F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D576887F60804A7D8CF775D11004A110 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51BD1F48F9284F2DBABDEE891D1F5400 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: EDEN-OS
          slot-name: Production
