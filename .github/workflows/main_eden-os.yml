# Azure validation path for EDEN Compute Optimizer v1.
# Controlled deployment on the feature branch only.

name: Azure deploy - EDEN Compute Optimizer v1

on:
  push:
    branches:
      - eden-compute-optimizer-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s optimizer_v1/tests -v

      - name: Build minimal deployment package
        run: |
          rm -f release.zip
          zip -r release.zip app.py requirements.txt optimizer_v1 \
            -x 'optimizer_v1/tests/*' 'optimizer_v1/results/*' '__pycache__/*' '*.pyc'
          unzip -l release.zip

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: f41f4dd4-3a57-4e69-900c-1e0d6089a8bc
          tenant-id: 0361f9da-46e7-4898-a6e0-a13f8f6859c7
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51BD1F48F9284F2DBABDEE891D1F5400 }}

      - name: Resolve Azure resource group
        shell: bash
        run: |
          RG="$(az webapp list --query "[?name=='EDEN-OS'].resourceGroup | [0]" -o tsv)"
          if [ -z "$RG" ]; then
            echo "EDEN-OS App Service was not found in this subscription."
            exit 1
          fi
          echo "AZURE_RG=$RG" >> "$GITHUB_ENV"
          echo "Resolved resource group: $RG"

      - name: Configure Python runtime and Flask startup
        shell: bash
        run: |
          az webapp config set \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --linux-fx-version "PYTHON|3.12" \
            --startup-file "gunicorn --bind=0.0.0.0:8000 --timeout 600 app:app" >/dev/null
          az webapp config appsettings set \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true >/dev/null
          echo "Runtime: $(az webapp config show -g "$AZURE_RG" -n EDEN-OS --query linuxFxVersion -o tsv)"

      - name: Deploy zip
        id: zipdeploy
        continue-on-error: true
        shell: bash
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --src-path release.zip \
            --type zip \
            --clean true \
            --restart true \
            --track-status false

      - name: Show deployment diagnostics on failure
        if: steps.zipdeploy.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Deployment log ==="
          az webapp log deployment show -g "$AZURE_RG" -n EDEN-OS || true
          echo "=== App configuration ==="
          az webapp config show -g "$AZURE_RG" -n EDEN-OS \
            --query '{linuxFxVersion:linuxFxVersion,alwaysOn:alwaysOn,appCommandLine:appCommandLine}' -o json || true
          exit 1

      - name: Verify live health endpoint
        shell: bash
        run: |
          URL="https://eden-os.azurewebsites.net/health"
          echo "Checking $URL"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$URL" | tee health.json; then
              echo
              echo "EDEN health endpoint is live."
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 10 seconds..."
            sleep 10
          done
          echo "Deployment completed but health endpoint did not become ready."
          az webapp log tail -g "$AZURE_RG" -n EDEN-OS --timeout 30 || true
          exit 1
