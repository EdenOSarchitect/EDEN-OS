# Azure validation path for EDEN Compute Optimizer v1.
# Controlled deployment on the feature branch only.

name: Azure deploy - EDEN Compute Optimizer v1

on:
  push:
    branches:
      - eden-compute-optimizer-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test optimizer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s optimizer_v1/tests -v

      - name: Build self-contained Azure package
        shell: bash
        run: |
          rm -rf release release.zip
          mkdir -p release/.python_packages/lib/site-packages
          cp app.py requirements.txt release/
          cp -R optimizer_v1 release/
          rm -rf release/optimizer_v1/tests release/optimizer_v1/results
          find release -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find release -type f -name '*.pyc' -delete
          python -m pip install \
            --target release/.python_packages/lib/site-packages \
            -r requirements.txt
          (cd release && zip -r ../release.zip .)
          unzip -l release.zip | tail -n 20

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: f41f4dd4-3a57-4e69-900c-1e0d6089a8bc
          tenant-id: 0361f9da-46e7-4898-a6e0-a13f8f6859c7
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51BD1F48F9284F2DBABDEE891D1F5400 }}

      - name: Resolve Azure target
        shell: bash
        run: |
          RG="$(az webapp list --query "[?name=='EDEN-OS'].resourceGroup | [0]" -o tsv)"
          if [ -z "$RG" ]; then
            echo "EDEN-OS App Service was not found in this subscription."
            exit 1
          fi
          HOST="$(az webapp show -g "$RG" -n EDEN-OS --query defaultHostName -o tsv)"
          if [ -z "$HOST" ]; then
            echo "Azure did not return a default hostname for EDEN-OS."
            exit 1
          fi
          echo "AZURE_RG=$RG" >> "$GITHUB_ENV"
          echo "AZURE_HOST=$HOST" >> "$GITHUB_ENV"
          echo "Resolved resource group: $RG"
          echo "Resolved host: $HOST"

      - name: Configure prebuilt Python runtime
        shell: bash
        run: |
          az webapp config set \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --linux-fx-version "PYTHON|3.12" \
            --startup-file "gunicorn --bind=0.0.0.0:8000 --timeout 600 app:app" >/dev/null
          az webapp config appsettings set \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false >/dev/null
          echo "Runtime: $(az webapp config show -g "$AZURE_RG" -n EDEN-OS --query linuxFxVersion -o tsv)"

      - name: Deploy prebuilt package
        id: zipdeploy
        continue-on-error: true
        shell: bash
        run: |
          az webapp deployment source config-zip \
            --resource-group "$AZURE_RG" \
            --name EDEN-OS \
            --src release.zip

      - name: Show deployment diagnostics on failure
        if: steps.zipdeploy.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Deployment log ==="
          az webapp log deployment show -g "$AZURE_RG" -n EDEN-OS || true
          echo "=== App configuration ==="
          az webapp config show -g "$AZURE_RG" -n EDEN-OS \
            --query '{linuxFxVersion:linuxFxVersion,alwaysOn:alwaysOn,appCommandLine:appCommandLine}' -o json || true
          exit 1

      - name: Restart app
        shell: bash
        run: az webapp restart -g "$AZURE_RG" -n EDEN-OS

      - name: Verify live health endpoint
        shell: bash
        run: |
          URL="https://${AZURE_HOST}/health"
          echo "Checking $URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$URL" | tee health.json; then
              echo
              echo "EDEN health endpoint is live."
              exit 0
            fi
            echo "Health check attempt $attempt failed; waiting 10 seconds..."
            sleep 10
          done
          echo "Deployment completed but health endpoint did not become ready."
          az webapp log tail -g "$AZURE_RG" -n EDEN-OS || true
          exit 1

      - name: Run small live Azure prove
        shell: bash
        run: |
          cat > prove-request.json <<'JSON'
          {
            "workload_id": "azure-small-live-prove-001",
            "payload": {
              "iterations": 100000,
              "seed": 42
            }
          }
          JSON
          curl --fail --silent --show-error \
            --max-time 120 \
            -H 'Content-Type: application/json' \
            --data @prove-request.json \
            "https://${AZURE_HOST}/prove" \
            | tee prove-result.json
          python - <<'PY'
          import json
          p=json.load(open('prove-result.json'))
          print('\n=== SMALL LIVE PROVE SUMMARY ===')
          v=p.get('verification', {})
          m=p.get('metrics', {})
          print('output_equivalence:', v.get('output_equivalence'))
          print('reuse_observed:', v.get('reuse_observed'))
          print('cpu_reduction_pct:', m.get('cpu_reduction_pct'))
          print('wall_reduction_pct:', m.get('wall_reduction_pct'))
          print('full_execution_avoided:', m.get('full_execution_avoided'))
          print('report_commitment:', p.get('report_commitment'))
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Upload live proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-azure-small-prove
          path: |
            health.json
            prove-request.json
            prove-result.json
