name: Validate Neural Field
on:
  push:
    branches: [eden-refinery-v2-import]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eden-refinery-v2-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree and build
        run: npm run build:dev
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Commit generated route tree
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "Eden Neural Validation Bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Regenerate route tree for Neural Field [skip ci]"
            git push
          fi
